[settings.task]
run_auto_install = false

[tasks.chief]
description = "Start or resume Chief of Staff inside nono"
dir = "{{ env.HOME }}/chief-of-staff"
raw = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ "$#" -eq 0 ]; then
  set -- 'AGENTS.md と hc --skill を読み、Chief of Staff として依頼を受けてください。'
fi
exec nono run --profile chouge-codex \
  --workdir "$HOME/chief-of-staff" --allow-cwd \
  --read "$HOME/.local/state/herdr-core/default" \
  --allow-unix-socket "$HOME/.local/state/herdr-core/default/default.sock" \
  --allow-unix-socket "$HOME/.config/herdr-app/herdr-app.sock" \
  --read-file "$(command -v herdr-app)" \
  -- codex --no-daemon --sandbox danger-full-access --ask-for-approval never \
  -C "$HOME/chief-of-staff" "$@"
'''
