[settings.task]
run_auto_install = false

[tasks.chief]
description = "Start or resume Chief of Staff inside nono"
dir = "{{ config_root }}"
raw = true
env = { CHIEF_MISE_CONFIG = "{{ config_root }}/mise.toml" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ "$#" -eq 0 ]; then
  set -- 'AGENTS.md と hc --skill を読み、Chief of Staff として依頼を受けてください。'
fi
runner=$(python3 -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().with_name("nono-codex.py"))' "$CHIEF_MISE_CONFIG")
exec python3 "$runner" "$@"
'''

[tasks.inspect-sample]
description = "Summarize explicitly supplied macOS sample files without connecting to core"
dir = "{{ config_root }}"
env = { CHIEF_MISE_CONFIG = "{{ config_root }}/mise.toml" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
reader=$(python3 -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().with_name("inspect-sample.py"))' "$CHIEF_MISE_CONFIG")
exec python3 "$reader" "$@"
'''

[tasks.compact-status]
description = "Project captured hc get JSON from stdin without connecting to core"
dir = "{{ config_root }}"
raw = true
env = { CHIEF_MISE_CONFIG = "{{ config_root }}/mise.toml" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
reader=$(python3 -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().with_name("compact-status.py"))' "$CHIEF_MISE_CONFIG")
exec python3 "$reader" "$@"
'''
