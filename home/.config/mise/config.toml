# Global tools: update one tool with `mise upgrade --bump <tool>`.
# Keep application/runtime state out of this repository.
[tools]
# Prefer the separately pinned npm over the copy bundled with Node.
npm = "11.6.1"
node = "24.9.0"
python = "3.13.7"
uv = "0.9.13"
go = "1.27.0"
bun = "1.3.14"
deno = "2.8.3"
java = "25.0.0"
flutter = "3.22.1-stable"
pnpm = "10.22.0"
mysql = "8.0.33"
sheldon = "0.8.5"
atuin = "18.16.1"
fzf = "0.73.1"
ripgrep = "15.1.0"
fd = "10.4.2"
lsd = "1.2.0"
bat = "0.26.1"
gh = "2.100.0"
ghq = "1.10.1"
jq = "1.8.1"
lazygit = "0.62.2"
"aqua:neovim/neovim" = "0.12.3"
tree-sitter = "0.26.8"
delta = "0.19.2"
starship = "1.22.1"
rtk = "0.42.3"
gcloud = "584.0.0"
hunk = "0.22.0"
codex = "0.154.0"
nono = "0.68.0"
apm = "0.29.0"
claude = "2.1.268"
"npm:@earendil-works/pi-coding-agent" = "0.85.1"
"npm:@oh-my-pi/pi-coding-agent" = "16.3.12"
"npm:@anthropic-ai/sandbox-runtime" = "0.0.76"
"npm:agent-browser" = "0.35.2"
"npm:textlint" = "15.8.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
stylua = "2.5.2"
taplo = "0.10.0"

[env]
_.path = ["{{ env.HOME }}/.local/bin"]
NVIM_LOG_FILE = "/dev/null"
RTK_TELEMETRY_DISABLED = "1"
