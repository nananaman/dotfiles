# Source of truth for the explicit dotfiles native-plugin sync task.
version = 1

[marketplaces.pstack-claude]
kind = "git"
source = "https://github.com/michael-denyer/pstack-claude.git"
ref = "5851c89613e2ddc3a6b7f4af02a42363b30ef8d3"

[marketplaces.nananaman-skills]
kind = "local"
source = "~/ghq/github.com/nananaman/skills"

[[plugins]]
selector = "pstack@pstack-claude"
runtime = "codex"
expected_version = "0.9.114"

[[plugins]]
selector = "nananaman-pstack-supplement@nananaman-skills"
runtime = "codex"
expected_version = "0.3.0"

